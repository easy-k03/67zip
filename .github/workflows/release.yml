name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-packages:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:stable
            kind: deb
          - distro: ubuntu
            image: ubuntu:24.04
            kind: deb
          - distro: fedora
            image: fedora:41
            kind: rpm
          - distro: alpine
            image: alpine:3.21
            kind: apk
          - distro: arch
            image: archlinux:base
            kind: arch
    steps:
      - uses: actions/checkout@v4
      - name: package
        run: |
          set -eu
          docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} \
            sh -c "sh packaging/in-container.sh ${{ matrix.kind }}"
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-${{ matrix.distro }}
          path: dist/*

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build tarball
        run: |
          set -eu
          brew install xz pkg-config
          # Homebrew on the arm64 runner installs under /opt/homebrew, which
          # is not a default compiler search path.
          prefix=$(brew --prefix)
          export CPPFLAGS="-I${prefix}/include"
          export LDFLAGS="-L${prefix}/lib"
          sh packaging/stage.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-macos
          path: dist/*

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build zip
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-xz"
          & $bash -lc "cd '$PWD' && export PATH=/mingw64/bin:`$PATH && CXX=g++ sh packaging/stage.sh windows"
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-windows
          path: dist/*

  # uses: cannot be an expression. Each VM action is its own job.
  freebsd:
    name: freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          # liblzma is in the base system. Nothing else is required to compile.
          prepare: echo freebsd-ready
          run: sh packaging/stage.sh freebsd
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-freebsd
          path: dist/*

  openbsd:
    name: openbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          sync: rsync
          # Base has clang. lzma.h is in the xz package, under /usr/local.
          prepare: pkg_add xz
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-openbsd
          path: dist/*

  netbsd:
    name: netbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          sync: rsync
          # The 11.0 image has no pkgin. pkg_add reads PKG_PATH. Base has no
          # lzma.h; the pkgsrc package is xz.
          prepare: pkg_add xz
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-netbsd
          path: dist/*

  dragonfly:
    name: dragonfly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          sync: rsync
          # liblzma is in base. stage.sh passes -std=c++17 itself.
          prepare: echo dragonfly-ready
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-dragonfly
          path: dist/*

  solaris:
    name: solaris
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/solaris-vm@v1
        with:
          usesh: true
          sync: rsync
          # 11.4-gcc ships gcc/g++. IPS pkg has no -y; a missing flag
          # aborts the job. liblzma is in the base system.
          release: 11.4-gcc
          prepare: echo solaris-ready
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-solaris
          path: dist/*

  illumos:
    name: illumos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/omnios-vm@v1
        with:
          usesh: true
          sync: rsync
          # The plain image has no gcc. The -build image does, and it
          # already has the headers a C++17 program needs.
          release: r151058-build
          prepare: echo omnios-ready
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-illumos
          path: dist/*

  haiku:
    name: haiku
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/haiku-vm@v1
        with:
          usesh: true
          sync: rsync
          # gcc is on the image. zlib and liblzma devel packages are not.
          prepare: pkgman install -y zlib_devel xz_utils_devel
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-haiku
          path: dist/*

  cross:
    name: cross-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-mingw
            packages: g++-mingw-w64-x86-64
            cxx: x86_64-w64-mingw32-g++
            host: x86_64-w64-mingw32
            kind: windows
          - target: android-arm64
            packages: wget unzip
            cxx: "false"
            host: aarch64-linux-android
            kind: android
    steps:
      - uses: actions/checkout@v4
      - name: packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} build-essential
      - name: build
        env:
          CXX: ${{ matrix.cxx }}
          HOST: ${{ matrix.host }}
          KIND: ${{ matrix.kind }}
        run: sh packaging/cross.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish
    needs:
      - linux-packages
      - macos
      - windows
      - freebsd
      - openbsd
      - netbsd
      - dragonfly
      - solaris
      - illumos
      - haiku
      - cross
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release name
        id: rel
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            short=$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)
            echo "tag=continuous" >> "$GITHUB_OUTPUT"
            echo "name=continuous ${short}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: dist/*
