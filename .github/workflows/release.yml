name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-packages:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:stable
            kind: deb
          - distro: ubuntu
            image: ubuntu:24.04
            kind: deb
          - distro: fedora
            image: fedora:41
            kind: rpm
          - distro: alpine
            image: alpine:3.21
            kind: apk
          - distro: arch
            image: archlinux:base
            kind: arch
    steps:
      - uses: actions/checkout@v4
      - name: package
        run: |
          set -eu
          docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} \
            sh -c "sh packaging/in-container.sh ${{ matrix.kind }}"
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-${{ matrix.distro }}
          path: dist/*

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build tarball
        run: |
          set -eu
          brew install xz pkg-config
          sh packaging/stage.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-macos
          path: dist/*

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build zip
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-xz"
          & $bash -lc "cd '$PWD' && export PATH=/mingw64/bin:`$PATH && CXX=x86_64-w64-mingw32-g++ sh packaging/stage.sh windows"
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-windows
          path: dist/*

  # uses: cannot be an expression. Each VM action is its own job.
  freebsd:
    name: freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          prepare: pkg install -y gmake pkgconf liblzma
          run: sh packaging/stage.sh freebsd
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-freebsd
          path: dist/*

  openbsd:
    name: openbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          sync: rsync
          prepare: pkg_add gmake xz
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-openbsd
          path: dist/*

  netbsd:
    name: netbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          sync: rsync
          prepare: pkgin -y install gmake pkg-config xz
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-netbsd
          path: dist/*

  dragonfly:
    name: dragonfly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          sync: rsync
          prepare: pkg install -y gcc pkgconf xz
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-dragonfly
          path: dist/*

  solaris:
    name: solaris
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/solaris-vm@v1
        with:
          usesh: true
          sync: rsync
          prepare: pkg install -y developer/gcc compress/xz
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-solaris
          path: dist/*

  illumos:
    name: illumos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/omnios-vm@v1
        with:
          usesh: true
          sync: rsync
          prepare: pkg install gcc xz
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-illumos
          path: dist/*

  haiku:
    name: haiku
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/haiku-vm@v1
        with:
          usesh: true
          sync: rsync
          prepare: pkgman install -y gcc zlib_devel xz_utils_devel
          run: sh packaging/stage.sh tarball
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-haiku
          path: dist/*

  cross:
    name: cross-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-mingw
            packages: g++-mingw-w64-x86-64
            cxx: x86_64-w64-mingw32-g++
            host: x86_64-w64-mingw32
            kind: windows
          - target: android-arm64
            packages: wget unzip
            cxx: "false"
            host: aarch64-linux-android
            kind: android
    steps:
      - uses: actions/checkout@v4
      - name: packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} build-essential
      - name: build
        env:
          CXX: ${{ matrix.cxx }}
          HOST: ${{ matrix.host }}
          KIND: ${{ matrix.kind }}
        run: sh packaging/cross.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 67zip-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish
    needs:
      - linux-packages
      - macos
      - windows
      - freebsd
      - openbsd
      - netbsd
      - dragonfly
      - solaris
      - illumos
      - haiku
      - cross
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
